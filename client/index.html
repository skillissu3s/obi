<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#121211" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iPhone home screens need a filled PNG; they ignore an SVG here -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Obi</title>
    <script>
      // apply theme before first paint
      try {
        var s = JSON.parse(localStorage.getItem('obi:prefs') || '{}')
        var t = s.theme || 'dark'
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
        document.documentElement.dataset.palette = s.palette || 'sumi'
        if (s.accent) document.documentElement.style.setProperty('--accent-user', s.accent)
        // the background, as the app last left it (see lib/wallpaper.js)
        var wp = JSON.parse(localStorage.getItem('obi:wp') || 'null')
        if (wp) {
          for (var k in wp) document.documentElement.style.setProperty(k, wp[k])
          document.documentElement.dataset.wallpaper = ''
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
